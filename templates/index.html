<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Útěk z ostrova</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="game-container">
        <h1>Útěk z tajemného ostrova</h1>
        <p>Probudil ses na neznámém místě a tvým jediným cílem je dostat se pryč.</p>
        <hr>
        <form method="POST">
            <label for="jmeno"><h3>Zadej jméno svého hrdiny:</h3></label>
            <input type="text" id="jmeno" name="jmeno" required autocomplete="off">
            <button type="submit" style="width: 100%; padding: 12px;">Začít dobrodružství</button>
        </form>
    </div>
</body>
</html>
